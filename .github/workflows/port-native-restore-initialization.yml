name: Port bound native restore initialization
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bound-native-restore-${{ github.ref }}
  cancel-in-progress: true
jobs:
  initialization:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        configuration: [debug, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Test complete bound initialization and saved-position helpers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
          bash Tools/test-native-restore-initialization.sh -c ${{ matrix.configuration }} 2>&1 | tee evidence/test.log
      - name: Retain exact source and tests
        if: always()
        run: |
          tar -czf evidence/source.tar.gz \
            Sources/LakeOfFireContent/Files/ReaderEBookInitialRestorePolicy.swift \
            Sources/LakeOfFireContent/Reader/ReaderContentEbookInitialRestore.swift \
            Sources/LakeOfFireReader/Reader/ReaderEBookInitialRestoreBridgeRequest.swift \
            Sources/LakeOfFireReader/Reader/ReaderMessageHandlersViewModifier.swift \
            Sources/LakeOfFireReader/Reader/Books/ReaderEBookInitialization.swift \
            Tests/LakeOfFireTests/ReaderEBookInitializationTests.swift \
            Tests/LakeOfFireTests/ReaderEBookNativeRestoreInitializationTests.swift \
            Tools/test-native-restore-initialization.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bound-native-restore-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
