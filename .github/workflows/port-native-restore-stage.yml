name: Qualify native restore port
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  staged-native:
    if: github.head_ref == 'port/v3-hotfix-to-main-20260928'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only hash-checked native adapter edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/input-commit.txt
          python3 Tools/PortingStage/native-restore.py apply
      - name: Test actual values, WebKit arguments and JS handoff
        env:
          NATIVE_RESTORE_SWIFT6: '1'
        run: |
          set -o pipefail
          export NATIVE_RESTORE_FIXTURES="$PWD/evidence/native-wire.json"
          bash Tools/test-native-restore-admission.sh -c debug 2>&1 | tee evidence/test.log
          node --test Tests/JavaScript/*.test.mjs > evidence/javascript.log 2>&1
      - name: Store verified immutable public blobs, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Tools/PortingStage/native-restore.py publish
      - name: Retain staged public source
        if: always()
        run: |
          tar -czf evidence/source.tar.gz Sources Tests Tools/NativeRestoreTests Tools/test-native-restore-admission.sh .port-native-stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-restore-stage-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
