name: Publish reviewed cell refresh refinement
on:
  push:
    branches: [review/20260917-refinement-transport]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e86a18a3a4e4325b75f9bf309f0919d071a177d3
          path: product
      - name: Reconstruct checked source trees without transport ancestry
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alex Ehlke'
          git config user.email '71601+aehlke@users.noreply.github.com'
          test "$(git rev-parse HEAD^{tree})" = aa97c792059e93892c7eef02f2645454f6e791fa
          git apply --index ../transport/review-transport/cell-tests.patch
          git diff --cached --check
          git commit -m 'test: reproduce cell refresh identity and cancelled admission gaps'
          test "$(git rev-parse HEAD^{tree})" = 7e9eb77de6ee9376e48cb16783d8030eec3b5619
          red=$(git rev-parse HEAD)
          git branch review/20260917-red-cell-refresh
          git apply --index ../transport/review-transport/cell-fix.patch
          git diff --cached --check
          git commit -m 'fix: refresh cell metadata through its cancellable load owner'
          test "$(git rev-parse HEAD^{tree})" = 93fba7c660560ad6377f17095dc5198771ede413
          git branch review/20260917-green-cell-refresh
          git push --atomic origin review/20260917-red-cell-refresh review/20260917-green-cell-refresh
          printf 'RED=%s\nGREEN=%s\nTREE=%s\n' "$red" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
