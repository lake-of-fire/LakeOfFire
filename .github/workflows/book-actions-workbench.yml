name: Book Actions workbench
# Qualification pass 4: preserve the production CSP during driver polling.
on:
  push:
    branches: [codex/book-actions-endcap-20260920]
    paths: [.github/workflows/book-actions-workbench.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.ref == 'refs/heads/codex/book-actions-endcap-20260920'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply reviewed navigation refinement
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7cdfd12e304154ef94f157232b3492e8481101d1 HEAD
          python3 Tools/book-actions/refine-endcap.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Tests/Browser/test_book_endcap_shell.py')
          s = p.read_text()
          old = "page.evaluate('reader.view.renderer.pageMetrics().page')"
          assert s.count(old) == 1
          s = s.replace(old, "page.evaluate('async () => (await reader.view.renderer.pageMetrics()).page')")
          old = "'pageMetadataUpdated','updateReadingProgress','ebookNativeMarkReadState',"
          assert s.count(old) == 1
          s = s.replace(old, "'pageMetadataUpdated','updateReadingProgress','ebookNativeMarkReadState',\n        'markAllSectionsAsRead','finishedReadingBook','startOver',")
          s = s.replace('from playwright.sync_api import sync_playwright', 'from playwright.sync_api import sync_playwright\nfrom browser_wait import wait_for_reader')
          s = s.replace('page.wait_for_function(', 'wait_for_reader(page, ')
          p.write_text(s)
          PY
          git diff --check
          node --check Sources/LakeOfFireReader/Resources/Resources/foliate-js/ebook-viewer.js
      - name: Unit tests
        run: |
          set -o pipefail
          node --test Tests/JavaScript/*.test.mjs 2>&1 | tee book-actions-unit-results.txt
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Real renderer browser journeys
        run: |
          set -o pipefail
          python3 Tests/Browser/test_book_endcap.py 2>&1 | tee book-actions-browser-results.txt
      - name: Actual viewer shell journey
        run: |
          set -o pipefail
          python3 Tests/Browser/test_book_endcap_shell.py 2>&1 | tee book-actions-shell-results.txt
      - name: Preserve qualification evidence
        if: always()
        run: git diff --binary > book-actions-reviewed.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: book-actions-qualification
          path: |
            book-actions-*-results.txt
            book-actions-reviewed.patch
          retention-days: 7
      - name: Publish tested changes without touching the release branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LakeOfFireReader/Resources/Resources/foliate-js Tests
          git commit -m 'Keep lookup navigation physical and qualify complete viewer-shell flow'
          git push origin HEAD:refs/heads/codex/book-actions-endcap-20260920
