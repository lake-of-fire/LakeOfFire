name: Stage import storage port
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'port/v3-hotfix-import-storage-20260928'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Retain candidate and verify adapter patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
          python3 Tools/stage-import-storage-hook.py evidence
          swiftc -frontend -parse evidence/ReaderFileManager.swift
      - name: Test real drive and complete import storage declarations
        shell: bash
        run: |
          set -euo pipefail
          export IMPORT_STORAGE_EVIDENCE_DIRECTORY="$PWD/evidence/executed"
          for configuration in debug release; do
            python3 Tools/test-import-storage-port.py --native --configuration "$configuration" 2>&1 | tee "evidence/$configuration.log"
          done
      - name: Store only the verified immutable adapter blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object evidence/ReaderFileManager.swift)" = 42d07384c9909a2ea9f2582f9a687337aa924750
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input evidence/fm-blob.json > evidence/blob-result.json
          python3 -c 'import json; assert json.load(open("evidence/blob-result.json"))["sha"] == "42d07384c9909a2ea9f2582f9a687337aa924750"'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-storage-stage-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
