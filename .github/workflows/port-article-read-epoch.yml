name: Port Article read-authority epoch
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: article-epoch-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: LakeOfFire
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/swiftui-webview
          ref: bb4b8d682b2befdf3bcf4285e3dae08771be2679
          path: swiftui-webview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/swift-brave
          ref: 84f2ba37df3992db73f62b99a3389cee886cbce5
          path: swift-brave
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/RealmSwiftGaps
          ref: 3c0ccf00d734cae997bd34654a4f2efd01397531
          path: RealmSwiftGaps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/BigSyncKit
          ref: 9cee5e112a6c3ca5cf530b3bce3d467f818b77f3
          path: BigSyncKit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftUIDownloads
          ref: 669fd0240f7af043e9161277f551177c671aa8b1
          path: SwiftUIDownloads
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/JapaneseLanguageTools
          ref: 6cffbb79f95eb1a8f07766e0bafee8410a98f7b7
          path: JapaneseLanguageTools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/FaviconFinder
          ref: dba1692ad10917e5501f7da61c5d53290ac10e7e
          path: FaviconFinder
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/SwiftSoup
          ref: e870c5ff5efacfce3aa423356fa918e6614f0e50
          path: SwiftSoup
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/swift-readability
          ref: 438724ab13e428a01ba4bb10ff6fbc8fa6c7330b
          path: swift-readability
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lake-of-fire/LakeKit
          ref: 4a60f068b20e2fb25055aad12f40fb1b7fd5c770
          path: LakeKit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aehlke/manabi-reader
          ref: d03c2f177285a9ca27b21e8ff0c302b2a7848808
          path: ReaderTuple
          persist-credentials: false
      - name: Materialize root-vendored SwiftUtilities
        shell: bash
        run: |
          set -euo pipefail
          cp -R ReaderTuple/Vendor/SwiftUtilities SwiftUtilities
          test -f SwiftUtilities/Package.swift
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Record exact tuple
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          for path in LakeOfFire swiftui-webview swift-brave RealmSwiftGaps BigSyncKit SwiftUIDownloads JapaneseLanguageTools FaviconFinder SwiftSoup swift-readability LakeKit; do
            printf '%s %s\n' "$path" "$(git -C "$path" rev-parse HEAD)"
          done | tee evidence/tuple.txt
          git -C ReaderTuple rev-parse HEAD >> evidence/tuple.txt
          find SwiftUtilities -type f -print0 | sort -z | xargs -0 shasum -a 256 > evidence/swiftutilities.sha256
          swift --version > evidence/toolchain.txt
      - name: Run actual Lake reader epoch tests
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path LakeOfFire --filter ArticleReadingProgressEpochPortTests 2>&1 | tee evidence/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-epoch-port-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
