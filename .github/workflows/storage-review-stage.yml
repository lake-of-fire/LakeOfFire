name: Apply exact-base storage ownership review
on:
  push:
    branches: [fix/reader-file-storage-ownership-20261005]
    paths: [.github/workflows/storage-review-stage.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'lake-of-fire/LakeOfFire' && github.ref == 'refs/heads/fix/reader-file-storage-ownership-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed exact-base changes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage-review"
          python3 .github/scripts/apply_storage_review.py | tee "$RUNNER_TEMP/storage-review/applied-blobs.jsonl"
          git diff --check
          git diff --binary > "$RUNNER_TEMP/storage-review/changes.patch"
          swift --version | tee "$RUNNER_TEMP/storage-review/swift-version.txt"
          for source in Sources/LakeOfFireContent/Files/ReaderFileManager.swift Tests/LakeOfFireTests/ReaderFileInitializationTests.swift Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift; do
            swiftc -frontend -parse "$source"
            printf 'syntax-only pass %s\n' "$source"
          done | tee "$RUNNER_TEMP/storage-review/syntax.log"
          tar -czf "$RUNNER_TEMP/storage-review/modified-source.tar.gz" Sources/LakeOfFireContent/Files/ReaderFileManager.swift Tests/LakeOfFireTests/ReaderFileInitializationTests.swift Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift
      - name: Commit only the reviewed files without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LakeOfFireContent/Files/ReaderFileManager.swift Tests/LakeOfFireTests/ReaderFileInitializationTests.swift Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift
          git rm .github/scripts/apply_storage_review.py
          git commit -m 'Fence Reader file deletion and initialization to original storage ownership'
          git push origin HEAD:refs/heads/fix/reader-file-storage-ownership-20261005
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage-review/published-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-review-source-and-syntax
          path: ${{ runner.temp }}/storage-review/
          if-no-files-found: error
