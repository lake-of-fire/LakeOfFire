name: Qualify loader continuation port
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: loader-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'port/v3-hotfix-to-main-20260928'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the exact reviewed viewer edit
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          node --version > evidence/node-version.txt
          python3 Tools/PortLoaderStage/apply.py
          git diff --check
          git diff -- Sources/LakeOfFireReader/Resources/foliate-js/ebook-viewer.js > evidence/viewer.patch
          node --check Sources/LakeOfFireReader/Resources/foliate-js/ebook-viewer.js
      - name: Execute all JavaScript regressions
        shell: bash
        run: |
          set -o pipefail
          node --test Tests/JavaScript/*.test.mjs 2>&1 | tee evidence/javascript-test.log
      - name: Store verified immutable viewer blob only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json
          data = Path('Sources/LakeOfFireReader/Resources/foliate-js/ebook-viewer.js').read_bytes()
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == 'cf8c66e1f65aa48bdab0cf741bec5a14b530fc76'
          Path('blob-request.json').write_text(json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}))
          PY
          # No ref/branch/PR writes. This only retains the independently checked
          # public blob so the final connector commit can select these bytes.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input blob-request.json --jq .sha > evidence/viewer-blob.txt
          rm blob-request.json
          test "$(cat evidence/viewer-blob.txt)" = cf8c66e1f65aa48bdab0cf741bec5a14b530fc76
      - name: Retain the actual tested source
        if: always()
        shell: bash
        run: |
          git ls-files -z Sources/LakeOfFireReader/Resources/foliate-js Tests/JavaScript | while IFS= read -r -d '' path; do
            printf '%s\t%s\n' "$(git hash-object "$path")" "$path"
          done > evidence/executed-source-manifest.txt
          tar -czf evidence/executed-source.tar.gz Sources/LakeOfFireReader/Resources/foliate-js Tests/JavaScript
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loader-stage-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
