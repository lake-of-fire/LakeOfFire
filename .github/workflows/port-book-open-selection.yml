name: Port book open selection ownership
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: book-open-selection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Retain exact inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
          git archive HEAD             Sources/LakeOfFireReader/Reader/Books/BookOpenSelectionCoordinator.swift             Sources/LakeOfFireReader/Reader/Books/BookLibraryView.swift             'Sources/LakeOfFireReader/Reader/Books/Book Views.swift'             Sources/LakeOfFireContent/Reader/WebViewNavigator+ReaderContent.swift             Tests/LakeOfFireTests/BookOpenSelectionCoordinatorTests.swift             Tests/LakeOfFireTests/BookOpenSelectionOwnershipTests.swift             Tools/test-book-open-selection.sh             .github/workflows/port-book-open-selection.yml | tar -x -C evidence
      - name: Test coordinator and parse real adapters
        shell: bash
        run: |
          set -euo pipefail
          bash Tools/test-book-open-selection.sh 2>&1 | tee evidence/test.log
          swiftc -frontend -parse Sources/LakeOfFireReader/Reader/Books/BookLibraryView.swift
          swiftc -frontend -parse 'Sources/LakeOfFireReader/Reader/Books/Book Views.swift'
          swiftc -frontend -parse Sources/LakeOfFireContent/Reader/WebViewNavigator+ReaderContent.swift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: book-open-selection-${{ matrix.os }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
