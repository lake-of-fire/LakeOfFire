name: Reader inventory refresh queue

on:
  push:
    branches:
      - fix/reader-inventory-refresh-errors-20260930
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build exact queue fixture
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/reader-refresh-queue"
          rm -rf "$root"
          mkdir -p "$root/Sources/LakeOfFireContent" "$root/Tests/LakeOfFireTests"
          cp Sources/LakeOfFireContent/Files/ReaderFileRefreshQueue.swift              "$root/Sources/LakeOfFireContent/ReaderFileRefreshQueue.swift"
          cp Tests/LakeOfFireTests/ReaderFileRefreshQueueTests.swift              "$root/Tests/LakeOfFireTests/ReaderFileRefreshQueueTests.swift"
          cat > "$root/Package.swift" <<'SWIFT'
// swift-tools-version: 5.10
import PackageDescription
let package = Package(
    name: "ReaderRefreshQueueChecks",
    targets: [
        .target(name: "LakeOfFireContent"),
        .testTarget(
            name: "LakeOfFireTests",
            dependencies: ["LakeOfFireContent"]
        ),
    ]
)
SWIFT
          printf '%s\n' "$root" >> "$GITHUB_ENV"
          echo "QUEUE_FIXTURE_ROOT=$root" >> "$GITHUB_ENV"
      - name: Debug
        run: |
          cd "$QUEUE_FIXTURE_ROOT"
          swift test --configuration debug             -Xswiftc -swift-version -Xswiftc 6             -Xswiftc -warnings-as-errors
      - name: Release
        run: |
          cd "$QUEUE_FIXTURE_ROOT"
          swift test --configuration release             -Xswiftc -swift-version -Xswiftc 6             -Xswiftc -warnings-as-errors
