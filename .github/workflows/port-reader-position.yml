name: Port reader position payloads
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-position-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  payloads:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        configuration: [debug, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Test actual Foundation message payloads
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
          export POSITION_PAYLOAD_EVIDENCE_DIRECTORY="$PWD/evidence"
          bash Tools/test-position-payloads.sh -c ${{ matrix.configuration }} 2>&1 | tee evidence/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-position-${{ matrix.os }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
