name: Book Actions finish integration
on:
  push:
    branches: [codex/book-actions-epochs-20260920]
    paths: [.github/workflows/book-actions-finish.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source integration
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/book-actions-epochs-20260920
          git merge-base --is-ancestor ed5fea70fdc827842eb2f2a66733d8359118f023 HEAD
          python3 Tools/book-actions/finish-integration.py
          git diff --check
          node --check Sources/LakeOfFireReader/Resources/Resources/foliate-js/ebook-viewer.js
      - name: Behavioral unit tests
        run: |
          set -o pipefail
          node --test Tests/JavaScript/*.test.mjs 2>&1 | tee book-actions-unit-results.txt
      - name: Preserve tested source on feature branch
        run: |
          set -euo pipefail
          rm Tools/book-actions/finish-integration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LakeOfFireReader/Resources/Resources/foliate-js Tests Tools/book-actions
          git commit -m 'Connect native chapter epochs to book end page, Mark and recovery'
          git push origin HEAD:refs/heads/codex/book-actions-epochs-20260920
      - name: Install browser test dependency
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Renderer layout journeys
        run: |
          set -o pipefail
          python3 Tests/Browser/test_book_endcap.py 2>&1 | tee book-actions-renderer-results.txt
      - name: Complete viewer shell journey
        run: |
          set -o pipefail
          python3 Tests/Browser/test_book_endcap_shell.py 2>&1 | tee book-actions-shell-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: book-actions-finish-results
          path: book-actions-*-results.txt
          retention-days: 7
