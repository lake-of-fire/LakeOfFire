name: Temporary EPUB initialization qualification
on:
  pull_request:
    paths:
      - '.github/workflows/epub-initialization-stage.yml'
permissions: {}
jobs:
  qualify:
    if: github.event.pull_request.number == 37 && github.event.pull_request.head.repo.full_name == 'lake-of-fire/LakeOfFire' && github.event.pull_request.head.ref == 'fix/epub-package-fingerprint-20260925'
    runs-on: macos-15
    timeout-minutes: 15
    # Only stores hash-verified immutable public source blobs after tests pass.
    # Never updates refs. Removed in the manual runtime commit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify the exact six-file patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/epub-init-evidence"
          git merge-base --is-ancestor 8cdac041e1caa9c1f56cb3f729568294105b4858 HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/epub-init-evidence/checked-out-commit.txt"
          swift --version | tee "$RUNNER_TEMP/epub-init-evidence/toolchain.txt"
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'epub-init-evidence'
          chunks = ['3f6584766e9391a9bb86a9f0b65a3d35374b5876', '1ae06732f54033a065b0770b37e9b3040a76f02f', '3cb5afac7916a8a6adafce2f5c5cc59fe7220235', '2df1bf739600908404bfdd22b5b24dca02743d0e', '1aa35d190d1a96fdb2f1deea14a36bccb4268f4c', 'c7a971e4c64576ed9b3069136709eb5ded5045ab', '3ee34448ef789bdf6a499a7fed1a16ff3662ba23']
          compressed = bytearray()
          for sha in chunks:
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/LakeOfFire/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response: value = json.load(response)
              assert value['encoding'] == 'base64'
              data = base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              compressed.extend(data)
          assert len(compressed) == 6406
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '252d2683cd78c2fc7f840daa6ac0666c2ceab21c9fd50fc6c52a2908cbf00175'
          patch_path = evidence / 'reviewed.patch'; patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--check', '--whitespace=error-all', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', str(patch_path)], check=True)
          expected = {
              '.github/workflows/ebook-fingerprint.yml': '935cec073e04059fc95d446fdff844c0362c59c0',
              'Documentation/epub-initialization-ownership-20260928.md': 'ef7d47dcf551d2f9777089d415cb607cab40677d',
              'Sources/LakeOfFireReader/Reader/Books/ReaderEBookInitialization.swift': 'd4a30505831cb95bd67e5a5da768493d519665ec',
              'Sources/LakeOfFireReader/Reader/ReaderMessageHandlersViewModifier.swift': 'b170b7a4b9dce21524d0433a255b5117c14a923e',
              'Tests/LakeOfFireTests/ReaderEBookInitializationTests.swift': '5fa5377e25d8c8d4835db9f9cc3b66cd8ff23e29',
              'Tools/test-ebook-initialization.sh': '61d744b8baaf840d92e1eb31b8b800048e9c628a',
          }
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')[:-1]
          assert set(paths) == set(expected)
          for path, sha in expected.items():
              data = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          (evidence / 'expected-blobs.json').write_text(json.dumps(expected, indent=2))
          subprocess.run(['tar', '-czf', str(evidence / 'patched-source.tar.gz'), *paths], check=True)
          PY
      - name: Execute native initialization and existing request and JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          swiftc -frontend -parse Sources/LakeOfFireReader/Reader/ReaderMessageHandlersViewModifier.swift
          for configuration in debug release; do
            bash Tools/test-ebook-initialization.sh -c "$configuration" 2>&1 | tee "$RUNNER_TEMP/epub-init-evidence/initialization-$configuration.log"
            bash Tools/test-ebook-entry-path.sh -c "$configuration" 2>&1 | tee "$RUNNER_TEMP/epub-init-evidence/entry-path-$configuration.log"
          done
          node --test Tests/JavaScript/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/epub-init-evidence/javascript.log"
          git diff --exit-code
      - name: Store verified immutable blobs without updating any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'epub-init-evidence'
          for configuration in ['debug', 'release']:
              log = (evidence / ('initialization-' + configuration + '.log')).read_text()
              passes = set(re.findall(r"Test Case '([^\n]+)' passed", log))
              assert len(passes) == 18, (configuration, len(passes))
              assert all('ReaderEBookInitializationTests' in p for p in passes)
              assert not re.search(r"Test Case .*'(?: failed| skipped)", log)
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          expected = json.loads((evidence / 'expected-blobs.json').read_text())
          assert len(expected) == 6
          for path, sha in expected.items():
              data = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/LakeOfFire/git/blobs', data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(), headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response: value = json.load(response)
              assert value['sha'] == sha
          (evidence / 'published-blobs.json').write_text(json.dumps(expected, indent=2))
          PY
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: epub-initialization-stage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/epub-init-evidence
          if-no-files-found: error
          retention-days: 7
