name: Storage deletion review delivery

on:
  pull_request:
    paths:
      - '.github/workflows/storage-delete-review-delivery.yml'
      - 'Tools/Review20261006/**'
      - 'Tests/Portable/run_delete_selection_controls.py'

permissions:
  contents: read

jobs:
  reviewed-delta:
    if: >-
      github.repository == 'lake-of-fire/LakeOfFire' &&
      github.event.pull_request.number == 109 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/storage-selection-closeout-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Preserve exact source and apply reviewed delta
        shell: bash
        run: |
          set -euo pipefail
          evidence=$(mktemp -d "$RUNNER_TEMP/storage-delete-review.XXXXXX")
          echo "REVIEW_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$evidence/parent.txt"
          swiftc --version > "$evidence/swift-version.txt"
          cp Sources/LakeOfFireContent/Files/ReaderFileManager.swift "$evidence/ReaderFileManager.before.swift"
          cp Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift "$evidence/ReaderFileLibraryBoundaryTests.before.swift"
          python3 Tools/Review20261006/patch_delete.py | tee "$evidence/published-blobs.json"
          cp Sources/LakeOfFireContent/Files/ReaderFileManager.swift "$evidence/ReaderFileManager.after.swift"
          cp Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift "$evidence/ReaderFileLibraryBoundaryTests.after.swift"
          cp Tests/Portable/run_delete_selection_controls.py "$evidence/runner.py"
          git diff -- Sources/LakeOfFireContent/Files/ReaderFileManager.swift Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift > "$evidence/changes.patch"
      - name: Exact original executor negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/Portable/run_delete_selection_controls.py "$REVIEW_EVIDENCE/ReaderFileManager.before.swift" "$REVIEW_EVIDENCE/original" --original | tee "$REVIEW_EVIDENCE/original-output.log"
      - name: Revised executor debug and optimized controls
        shell: bash
        run: |
          set -euo pipefail
          python3 Tests/Portable/run_delete_selection_controls.py Sources/LakeOfFireContent/Files/ReaderFileManager.swift "$REVIEW_EVIDENCE/debug" | tee "$REVIEW_EVIDENCE/debug-output.log"
          python3 Tests/Portable/run_delete_selection_controls.py Sources/LakeOfFireContent/Files/ReaderFileManager.swift "$REVIEW_EVIDENCE/optimized" --optimized | tee "$REVIEW_EVIDENCE/optimized-output.log"
      - name: Publish only the reviewed source and native owner additions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources/LakeOfFireContent/Files/ReaderFileManager.swift Tests/LakeOfFireTests/ReaderFileLibraryBoundaryTests.swift
          git commit -m 'fix: retain original deletion admission through I/O and journal phases'
          # A concurrent branch advance rejects this fast-forward push. No force,
          # merge, protected target, production file or account access is involved.
          git push origin HEAD:refs/heads/codex/storage-selection-closeout-20261005
          git rev-parse HEAD > "$REVIEW_EVIDENCE/published-head.txt"
      - name: Retain exact sources, controls and all failed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-delete-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REVIEW_EVIDENCE }}
          if-no-files-found: error
