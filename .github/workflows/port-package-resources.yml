name: Port package resource regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resources:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        zip: [released, locked-development]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Retain exact inputs
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
      - name: Test real package I/O and metadata parser
        env:
          PACKAGE_RESOURCE_ZIP_REFERENCE: ${{ matrix.zip }}
        shell: bash
        run: |
          set -o pipefail
          export PACKAGE_RESOURCE_EVIDENCE_DIRECTORY="$PWD/evidence"
          bash Tools/test-package-resources.sh -c ${{ matrix.configuration }} 2>&1 | tee evidence/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-resources-${{ matrix.zip }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
