name: Exact EPUB package fingerprints
on:
  pull_request:
    paths:
      - 'Sources/LakeOfFireContent/Files/ReaderEBookPackageFingerprint.swift'
      - 'Sources/LakeOfFireContent/Files/ReaderEBookZIPDirectory.swift'
      - 'Tests/LakeOfFireTests/ReaderEBook*Fingerprint*Tests.swift'
      - 'Tests/LakeOfFireTests/ReaderEBookZIPDirectoryTests.swift'
      - 'Tools/EBookFingerprintTests/**'
      - 'Tools/test-ebook-fingerprint.sh'
      - 'Tools/test-ebook-zip-directory.sh'
      - '.github/workflows/ebook-fingerprint.yml'
permissions:
  contents: read
jobs:
  fingerprint:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: bash Tools/test-ebook-fingerprint.sh
