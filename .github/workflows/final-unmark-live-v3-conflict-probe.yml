name: Final Unmark live-v3 integration

on:
  push:
    branches:
      - integration/final-unmark-live-v3-20261009
    paths:
      - .github/workflows/final-unmark-live-v3-conflict-probe.yml

permissions:
  contents: write

concurrency:
  group: final-unmark-live-v3-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the exact live v3 history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin v3-hotfix
          live_head="$(git rev-parse origin/v3-hotfix)"
          test "$live_head" = d2fd5ed8e964e91a92ce1aeb02018293a5ca539c
          git -c user.name=github-actions-ci \
            -c user.email=41898282+github-actions-ci@users.noreply.github.com \
            merge --no-ff origin/v3-hotfix \
            -m "Merge landed EPUB continuity into final Unmark candidate"
          git merge-base --is-ancestor b3cc6ec112466a13d518bb89cdc27920cebe55ea HEAD
          git merge-base --is-ancestor "$live_head" HEAD
          git diff --check HEAD^1..HEAD
          git push origin HEAD:integration/final-unmark-live-v3-20261009
