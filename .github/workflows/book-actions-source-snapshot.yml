name: Book Actions source snapshot
on:
  push:
    branches: [codex/book-actions-endcap-20260920]
    paths: [.github/workflows/book-actions-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked source, excluding runtime and credentials
        run: git archive --format=tar.gz --output=book-actions-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: book-actions-source
          path: book-actions-source.tar.gz
          retention-days: 1
          if-no-files-found: error
