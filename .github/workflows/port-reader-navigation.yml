name: Port reader navigation regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: port-reader-navigation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record inputs and run the complete JavaScript suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          node --version > evidence/node-version.txt
          node --test Tests/JavaScript/*.test.mjs 2>&1 | tee evidence/javascript-test.log
      - name: Retain executed source and tests
        if: always()
        shell: bash
        run: |
          tar -czf evidence/navigation-source.tar.gz Sources/LakeOfFireReader/Resources/foliate-js Tests/JavaScript
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-reader-navigation-${{ matrix.os }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
