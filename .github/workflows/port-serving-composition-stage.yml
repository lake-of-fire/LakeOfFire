name: Stage exact EPUB serving composition
on:
  pull_request:
    branches: [main]
    paths:
      - 'Tools/PortComposition/**'
      - '.github/workflows/port-serving-composition-stage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and test only the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/input-commit.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          hashes = {
            'Sources/LakeOfFireReader/Resources/foliate-js/ebook-viewer.js': 'cf8c66e1f65aa48bdab0cf741bec5a14b530fc76',
            'Sources/LakeOfFireContent/Files/ReaderEBookServingSession.swift': '5bd940f14c5464f4de398bba3e082684db6e437e',
            'Tests/JavaScript/ebook-native-source-request.test.mjs': '26f962cede7228e9bcfe72feede0770beaf51ae0',
            'Tools/test-ebook-fingerprint.sh': '9497ce05a374df559e29732c0e1894d23ecf1c9f',
          }
          for path, sha in hashes.items():
              data = Path(path).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == sha, path
          PY
          git apply --check Tools/PortComposition/composition.patch
          git apply Tools/PortComposition/composition.patch
          node --check Sources/LakeOfFireReader/Resources/foliate-js/ebook-viewer.js
          node --check Sources/LakeOfFireReader/Resources/foliate-js/ebook-native-loader.js
          node --test Tests/JavaScript/*.test.mjs 2>&1 | tee evidence/javascript-test.log
      - name: Retain immutable verified public blobs only, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          hashes = {
            'Sources/LakeOfFireReader/Resources/foliate-js/ebook-viewer.js': 'f487b9387a21748780c51d6359b1daf88f850ba9',
            'Sources/LakeOfFireContent/Files/ReaderEBookServingSession.swift': 'ea3233c3706b577da3ad55bc5034738e3afb2262',
            'Tests/JavaScript/ebook-native-source-request.test.mjs': 'ac027cab2e1d34c625e289b78b1342584539563f',
            'Tools/test-ebook-fingerprint.sh': '44ef1019b761f3e86574252c9585c731258cbbf2',
          }
          for path, expected in hashes.items():
              data = Path(path).read_bytes()
              assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == expected, path
              request = urllib.request.Request('https://api.github.com/repos/lake-of-fire/LakeOfFire/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding':'base64'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  assert json.load(response)['sha'] == expected, path
          Path('evidence/verified-blobs.json').write_text(json.dumps(hashes, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serving-composition-stage-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
