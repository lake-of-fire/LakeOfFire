name: Port legacy document migration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-documents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2.1'
      - name: Record and test actual filesystem implementation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git ls-tree -r HEAD > evidence/source-manifest.txt
          swift --version > evidence/toolchain.txt
          export LEGACY_DOCUMENTS_EVIDENCE_DIRECTORY="$PWD/evidence"
          bash Tools/test-legacy-documents-migration.sh -c ${{ matrix.configuration }} 2>&1 | tee evidence/test.log
      - name: Typecheck production helper at iOS 15 simulator minimum
        shell: bash
        run: |
          set -o pipefail
          xcrun swiftc -typecheck -swift-version 6 -warnings-as-errors \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios15.0-simulator \
            Sources/LakeOfFireContent/Files/ReaderLegacyDocumentsMigration.swift 2>&1 | tee evidence/ios-typecheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-documents-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: evidence
          retention-days: 7
          if-no-files-found: error
